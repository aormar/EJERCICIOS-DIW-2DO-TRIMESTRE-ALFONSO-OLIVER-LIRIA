<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title>FORMULARIO</title>
        <meta name="description" content="">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="./css/style.css">
    </head>
    <body class="bg-color-dark text-color-white">
        <div class="d-flex flex-column align-items-center justify-content-center border-radius-10 p-5">
            <h1 class="text-color-white text-center">Sign Up</h1>
            <form action="" method="post" class="d-flex flex-column align-items-center justify-content-center">
                <div class="form-group">
                    <label for="name" class="text-color-white">Name:</label>
                    <input type="text" id="name" name="name" class="form-control" placeholder="Enter your name">
                    <label for="email" class="text-color-white">Email:</label>
                    <input type="email" id="email" name="email" class="form-control" placeholder="Enter your email">
                    <label for="password" class="text-color-white">Password:</label>
                    <input type="password" id="password" name="password" class="form-control" placeholder="Enter your password">
                    <label for="terms" class="text-color-white inline-block">
                        <input type="checkbox" id="terms" name="terms" class="form-check">
                        I agree with terms and conditions
                    </label>
                    <button type="submit" class="btn btn-primary bg-color-blue text-color-white mt-3">Sign Up</button>
                </div>
        <script src="" async defer></script>
    </body>
</html>
